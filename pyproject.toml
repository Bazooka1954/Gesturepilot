[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gesturepilot"
version = "0.1.0"
description = "Windows desktop application for webcam-based hand gesture control."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "MIT" }
authors = [{ name = "GesturePilot contributors" }]
keywords = ["gesture", "hand-tracking", "windows", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Topic :: Desktop Environment",
]

# OpenCV and NumPy back the camera capture layer (Phase 2).
# MediaPipe and opencv-contrib-python back the hand-tracking layer (Phase 3).
# opencv-contrib-python replaces opencv-python: both ship the top-level `cv2`
# package, and MediaPipe requires the contrib build. Installing both corrupts cv2.
dependencies = [
    "mediapipe>=1.0.1,<2",
    "numpy>=2.2.6",
    "opencv-contrib-python>=5.0.0.93,<6",
]

[project.scripts]
gesturepilot = "gesturepilot.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gesturepilot"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config -m 'not integration'"
xfail_strict = true
markers = [
    "integration: requires real hardware; deselected by default, opt in with -m integration",
    "webcam: requires a physical camera",
]

[tool.coverage.run]
source = ["gesturepilot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
